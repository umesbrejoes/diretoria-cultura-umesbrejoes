<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Acesso restrito | Diretoria de Cultura</title><link rel="stylesheet" href="../styles.css"></head><body class="admin-login-page"><main class="admin-login"><div class="admin-login-card"><img src="../logo-umes.webp" alt="Logo oficial da UMES Brejões" class="admin-login-logo"><div class="tag">ÁREA RESTRITA</div><h1>Diretoria de Cultura</h1><p>Acesso exclusivo para integrantes autorizados da Diretoria de Cultura da UMES Brejões.</p><form id="loginForm"><label for="password">Senha de acesso<input id="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></label><button id="loginButton" class="btn primary form-submit" type="submit">Entrar no painel</button><div id="loginError" class="admin-login-error" hidden></div></form><a class="admin-back" href="../index.html">← Voltar ao portal</a></div></main><script>const PASSWORD_HASH=["193b5a3c455c22a523f0c2db7339956a","9c87bf8b98516f8888d1284622b5994e"].join("");const SESSION_KEY="umes_cultura_admin_session";async function sha256(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",data);return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("")}document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("loginButton"),error=document.getElementById("loginError"),input=document.getElementById("password");error.hidden=true;button.disabled=true;button.textContent="Verificando...";try{const ok=await sha256(input.value)===PASSWORD_HASH;if(ok){sessionStorage.setItem(SESSION_KEY,"1");localStorage.setItem(SESSION_KEY,"1");window.location.replace("./index.html")}else{error.textContent="Senha incorreta. Verifique a senha e tente novamente.";error.hidden=false}}catch(err){error.textContent="Não foi possível validar o acesso neste navegador. Use o endereço HTTPS do site.";error.hidden=false}finally{button.disabled=false;button.textContent="Entrar no painel"}});</script></body></html>
