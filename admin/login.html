<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso restrito | Diretoria de Cultura</title><link rel="stylesheet" href="../styles.css"></head><body class="admin-login-page"><main class="admin-login"><div class="admin-login-card"><img src="../logo-umes.webp" alt="Logo oficial da UMES Brejões" class="admin-login-logo"><div class="tag">ÁREA RESTRITA</div><h1>Diretoria de Cultura</h1><p>Acesso exclusivo para integrantes autorizados da Diretoria de Cultura da UMES Brejões.</p><form id="loginForm"><label for="password">Senha de acesso<input id="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></label><button class="btn primary form-submit" type="submit">Entrar no painel</button><div id="loginError" class="admin-login-error" hidden>Senha incorreta. Verifique os dados e tente novamente.</div></form><a class="admin-back" href="../index.html">← Voltar ao portal</a></div></main><script>const PASSWORD_HASH="193b5a3c455c22a523f0c2db7339956a9c87bf8b98516f8888d1284622b5994e";const SESSION_KEY="umes_cultura_admin_session";async function sha256(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("")}document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const error=document.getElementById("loginError");if(PASSWORD_HASH==="__CONFIGURE_HASH__"){error.hidden=false;error.textContent="A senha ainda não foi configurada pelo administrador do site.";return}const hash=await sha256(document.getElementById("password").value);if(hash===PASSWORD_HASH){sessionStorage.setItem(SESSION_KEY,"1");location.href="index.html"}else{error.hidden=false}});</script></body></html>
